[project]
name = "rosbag-de-pipeline"
version = "1.0.0"
description = "Medallion-architecture analytics pipeline over ROS bag robot telemetry"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "pyarrow>=15",
    "rosbags>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# setuptools cannot auto-discover packages in a flat layout that has more than
# one top-level directory — it refuses rather than guesses which are packages
# and which are not. `models/` is dbt SQL, not a Python package, so discovery
# has to be told exactly what to ship. Without this, `pip install -e .` works
# locally (the package is already present) but fails on a clean CI checkout.
[tool.setuptools]
packages = ["generate", "ingest", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
